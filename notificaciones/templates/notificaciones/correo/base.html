<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notificación{% endblock %}</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; color: #333333; }
        .container { max-width: 600px; margin: 24px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e1e4e8; }
        .header { background-color: #1a56db; color: #ffffff; padding: 20px 24px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .content { padding: 24px; line-height: 1.6; font-size: 15px; }
        .code-box { background-color: #f0f4ff; border: 1px dashed #1a56db; padding: 14px; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #1a56db; margin: 20px 0; border-radius: 6px; }
        .btn { display: inline-block; background-color: #1a56db; color: #ffffff !important; text-decoration: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; margin: 16px 0; }
        .footer { background-color: #f8fafc; padding: 16px 24px; text-align: center; font-size: 12px; color: #64748b; border-top: 1px solid #e1e4e8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{% block header_title %}Sistema de Usuarios{% endblock %}</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>Correo automático, no respondas.</p>
        </div>
    </div>
</body>
</html>
