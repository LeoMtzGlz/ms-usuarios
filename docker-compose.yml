services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ms_usuarios
      POSTGRES_USER: ms_user
      POSTGRES_PASSWORD: ms_password
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ms_user -d ms_usuarios"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  datos_pg:
