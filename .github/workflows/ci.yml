# T-06/ST-29: estilo, migraciones y pruebas contra PostgreSQL 16 en cada push y PR.
# El id y el nombre del job ("pruebas") son el check obligatorio de ST-30: no cambiarlos.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [development, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ms_usuarios
          POSTGRES_USER: ms_user
          POSTGRES_PASSWORD: ms_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ms_user -d ms_usuarios"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Valores solo para CI: no son secretos reales
      SECRET_KEY: clave-solo-para-ci-no-usar-en-produccion
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ms_user:ms_password@localhost:5432/ms_usuarios

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Revisar estilo (ruff)
        run: ruff check .

      - name: Revisar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones
        run: python manage.py migrate --noinput

      - name: Correr pruebas
        run: pytest
